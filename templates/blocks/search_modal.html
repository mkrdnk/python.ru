<dialog class="search-dialog" aria-labelledby="search-title">
  <div class="search-modal">
    <form class="search-input-wrap" action="/search/" method="get">
      <label class="visually-hidden" id="search-title" for="modal-query">Поиск по сайту</label>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="modal-query" name="q" type="search" maxlength="200" placeholder="Статьи, люди, проекты…" required>
      <button type="button" data-close-search aria-label="Закрыть поиск"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </form>
    <p><span>Подсказка:</span> попробуйте «asyncio», «Django» или имя автора</p>
  </div>
</dialog>
