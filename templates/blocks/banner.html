<aside class="site-banner site-banner--{{ place }}{% if place == 'top' or place == 'bottom' %} container{% endif %}" aria-label="Баннер" data-banner-position="{{ place }}">
  <a class="site-banner__link" href="{{ banner.link_to }}" style="width: {{ banner.safe_width|default:'auto' }};">
    <img src="{{ banner.file_img.url }}" alt="{{ banner.name }}" decoding="async"{% if place != 'top' %} loading="lazy"{% endif %} style="max-height: {{ banner.safe_height|default:'none' }};">
  </a>
</aside>
