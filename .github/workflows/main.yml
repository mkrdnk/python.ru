name: Test, build and deploy Docker container
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: pythonru
          POSTGRES_PASSWORD: pythonru-test
          POSTGRES_DB: pythonru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pythonru -d pythonru"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://pythonru:pythonru-test@127.0.0.1:5432/pythonru' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=apps --cov=python_ru
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Login to DockerHub Registry
      run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
    - name: Build the tagged Docker image
      run: docker build . --file Dockerfile --tag korneevm/pythonru
    - name: Push the tagged Docker image
      run: docker push korneevm/pythonru
    - name: login to server and pull container
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT }}
        script_stop: true
        script: |
          cd /opt/servers
          docker-compose pull pythonru
          docker-compose up -d
          docker exec -i servers_pythonru_1 python3 manage.py migrate --noinput
          docker exec -i servers_pythonru_1 python3 manage.py collectstatic --noinput
